<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --hover: #eff6ff;

      margin: 0;
      width: 360px;
      min-height: 430px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    body.dark {
      --background: #0b1220;
      --surface: #111a2b;
      --border: #26344d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --hover: #162238;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    :focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 3px;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
    }

    .header-controls {
      display: flex;
      flex-shrink: 0;
      gap: 6px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
    }

    .icon-button:hover {
      background: var(--hover);
      border-color: #3b82f6;
    }

    body.dark #themeToggle {
      color: #facc15;
    }

    .greeting {
      margin-bottom: 13px;
    }

    .greeting-title {
      font-size: 13px;
      font-weight: 600;
    }

    .greeting-text {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .action {
      width: 100%;
      min-height: 65px;
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }

    .action:hover {
      transform: translateY(-1px);
      border-color: #3b82f6;
      background: var(--hover);
    }

    .action-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 11px;
      border-radius: 11px;
      font-size: 17px;
    }

    .time-icon {
      background: #eff6ff;
      color: #2563eb;
    }

    .break-icon {
      background: #fff7ed;
      color: #ea580c;
    }

    body.dark .time-icon {
      background: #172554;
    }

    body.dark .break-icon {
      background: #431407;
    }

    .action-content {
      flex: 1;
    }

    .action-title {
      display: block;
      font-size: 12px;
      font-weight: 650;
    }

    .action-description {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
    }

    .action-arrow {
      color: var(--muted);
      font-size: 16px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 7px;
    }

    .quick-action {
      min-width: 0;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }

    .quick-action:hover {
      background: var(--hover);
      border-color: #3b82f6;
    }

    .quick-icon {
      margin-bottom: 5px;
      font-size: 16px;
    }

    .quick-title {
      font-size: 9px;
      font-weight: 650;
    }

    .quick-description {
      margin-top: 3px;
      color: var(--muted);
      font-size: 8px;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status.show {
      display: block;
    }

    .status.success {
      border-color: #16a34a;
      color: #15803d;
    }

    .status.error {
      border-color: #ef4444;
      color: #dc2626;
    }

    body.dark .status.success {
      color: #86efac;
    }

    body.dark .status.error {
      color: #fca5a5;
    }

    dialog {
      width: calc(100% - 32px);
      max-height: 90vh;
      margin: auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
    }

    .modal-icon {
      margin-bottom: 12px;
      font-size: 28px;
    }

    dialog h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-text {
      margin: 10px 0 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
    }

    .modal-button {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--background);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    .confirm-button {
      border-color: #2563eb;
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <img
          class="brand-icon"
          src="images/icon.png"
          alt="Tempo"
        >

        <div>
          <div class="brand-name">Tempo</div>
          <div class="brand-subtitle">
            Time Entry &amp; Management Platform for Office
          </div>
        </div>
      </div>

      <div class="header-controls">
        <button
          id="settingsButton"
          class="icon-button"
          type="button"
          title="Open Settings"
          aria-label="Open Settings"
        >⚙</button>

        <button
          id="themeToggle"
          class="icon-button"
          type="button"
          title="Toggle dark/light mode"
          aria-label="Toggle dark/light mode"
        >☾</button>
      </div>
    </header>

    <div class="greeting">
      <div class="greeting-title">Choose an action below</div>
    </div>

    <div class="actions">
      <button id="timeInButton" class="action" type="button">
        <span class="action-icon time-icon">▶</span>
        <span class="action-content">
          <span class="action-title">Time In</span>
          <span class="action-description">Start your time in</span>
        </span>
        <span class="action-arrow">→</span>
      </button>

      <button id="snackButton" class="action" type="button">
        <span class="action-icon break-icon">☕</span>
        <span class="action-content">
          <span class="action-title">Snack Break</span>
          <span class="action-description">30 minute break</span>
        </span>
        <span class="action-arrow">→</span>
      </button>

      <button id="lunchButton" class="action" type="button">
        <span class="action-icon break-icon">🍱</span>
        <span class="action-content">
          <span class="action-title">Lunch</span>
          <span class="action-description">1 hour break</span>
        </span>
        <span class="action-arrow">→</span>
      </button>
    </div>

    <div class="quick-actions">
      <button id="snack2Button" class="quick-action" type="button">
        <span class="quick-icon">☕</span>
        <span class="quick-title">Snack Break (RTO)</span>
        <span class="quick-description">No auto back</span>
      </button>

      <button id="lunch2Button" class="quick-action" type="button">
        <span class="quick-icon">🍱</span>
        <span class="quick-title">Lunch (RTO)</span>
        <span class="quick-description">No auto back</span>
      </button>

      <button id="back2Button" class="quick-action" type="button">
        <span class="quick-icon">↩</span>
        <span class="quick-title">Back</span>
        <span class="quick-description">Send back</span>
      </button>
    </div>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>
  </main>

  <dialog id="confirmationDialog" aria-labelledby="modalTitle">
    <div id="modalIcon" class="modal-icon">▶</div>
    <h2 id="modalTitle">Confirm action</h2>
    <p id="modalText" class="modal-text"></p>

    <div class="modal-buttons">
      <button id="cancelButton" class="modal-button" type="button">
        Cancel
      </button>

      <button
        id="confirmButton"
        class="modal-button confirm-button"
        type="button"
      >
        Confirm
      </button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
